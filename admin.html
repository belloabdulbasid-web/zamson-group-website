<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zamson Group Admin</title><link rel="stylesheet" href="css/site.css"><style>
.wrap{max-width:1100px;margin:40px auto;padding:20px}.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin:16px 0}.panel input,.panel textarea,.panel select{display:block;width:100%;padding:11px;margin:8px 0 14px;box-sizing:border-box;border:1px solid #bbb;border-radius:7px}.btnx,button{padding:10px 15px;border:0;border-radius:7px;background:#176b3a;color:white;cursor:pointer;margin:3px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.muted{color:#68736a}
</style></head><body><header><a class="brand" href="index.html"><img src="assets/company-logo.jpeg" alt=""><span>ZAMSON GROUP</span></a><a class="btn header-cta" href="index.html">View Website</a></header><main class="wrap"><h1>Website Admin Dashboard</h1><section id="login" class="panel"><h2>Administrator sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form><p id="loginMsg"></p></section><div id="dash" class="hidden"><section class="panel"><button id="logout">Sign out</button><span id="who" class="muted"></span><p id="msg"></p></section><div class="tabs"><button data-tab="projects">Projects</button><button data-tab="news">News</button><button data-tab="leadership">Leadership</button></div>
<section id="projects" class="panel"><h2>Projects</h2><form id="pf"><input id="pid" type="hidden"><label>Title<input id="pt" required></label><label>Location<input id="pl"></label><label>Status<select id="ps"><option>Upcoming</option><option>Ongoing</option><option>Completed</option></select></label><label>Description<textarea id="pd"></textarea></label><label>Image<input id="pi" type="file" accept="image/*"></label><button>Save project</button><button type="button" id="pc">Clear</button></form><table><tbody id="pr"></tbody></table></section>
<section id="news" class="panel hidden"><h2>News & announcements</h2><form id="nf"><input id="nid" type="hidden"><label>Headline<input id="nt" required></label><label>Content<textarea id="nc"></textarea></label><label>Image<input id="ni" type="file" accept="image/*"></label><label><input id="np" type="checkbox" style="display:inline;width:auto"> Published</label><button>Save news</button><button type="button" id="nclear">Clear</button></form><table><tbody id="nr"></tbody></table></section>
<section id="leadership" class="panel hidden"><h2>Leadership</h2><form id="lf"><input id="lid" type="hidden"><label>Full name<input id="ln" required></label><label>Position<input id="lr"></label><label>Biography<textarea id="lb"></textarea></label><label>Photo<input id="li" type="file" accept="image/*"></label><button>Save profile</button><button type="button" id="lclear">Clear</button></form><table><tbody id="lrw"></tbody></table></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/admin.js"></script></body></html>
